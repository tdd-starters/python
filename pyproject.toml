[project]
name = "python_starter"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.9"

[tool.uv]
package = true

[tool.ruff]
select = ["ALL"]
ignore = ["D211", "D213", "T201"]

[tool.ruff.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "INP001", "ANN201"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]


